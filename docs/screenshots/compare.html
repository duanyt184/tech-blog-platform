<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forum 截图对比</title><style>body{margin:20px;font:15px system-ui;color:#26251e;background:#f7f7f4}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap}select{padding:8px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;min-width:0}figcaption{padding:14px 0}img{width:100%;border:1px solid #ddd}p{color:#666}@media(max-width:700px){main{grid-template-columns:1fr}}</style><header><h1>Forum 截图对比</h1><label>页面 <select id="page"><option value="home">home</option><option value="categories">categories</option><option value="latest">latest</option><option value="topic">topic</option><option value="search">search</option><option value="tags">tags</option><option value="profile">profile</option><option value="home-dark">home-dark</option><option value="home-mobile">home-mobile</option></select></label><a href="../VISUAL_REVIEW.md">复核说明</a></header><p>两侧使用不同的真实数据；本页便于比较布局、字体、配色和间距，不代表零像素差异。</p><main><figure><figcaption>原站公开页面 · 2026-11-08</figcaption><img id="reference" alt="原站截图" src="reference/home.png"></figure><figure><figcaption>本地隔离测试实例 · 2026-11-09</figcaption><img id="local" alt="本地截图" src="local/home.png"></figure></main><script>document.querySelector('#page').addEventListener('change',e=>{for(const type of ['reference','local'])document.getElementById(type).src=type+'/'+e.target.value+'.png'})</script></html>
