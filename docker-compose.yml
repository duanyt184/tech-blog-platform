name: tech-blog-platform

services:
  mysql:
    image: mysql:8.0
    container_name: tech-blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-tech_blog_root_dev_password}
      MYSQL_DATABASE: ${DB_NAME:-tech_blog}
      MYSQL_USER: ${DB_USER:-tech_blog}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tech_blog_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
    name: tech-blog-mysql-data

